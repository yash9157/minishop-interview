<div class="page-head">
  <h1>Pending approvals</h1>
</div>
<div class="panel">
  <p-table
    [value]="requests()"
    [lazy]="true"
    [lazyLoadOnInit]="false"
    [paginator]="true"
    [alwaysShowPaginator]="true"
    [first]="(page - 1) * pageSize"
    [rows]="pageSize"
    [totalRecords]="totalCount()"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="Page {currentPage} of {totalPages} · {totalRecords} items"
    [scrollable]="true"
    (onPage)="changePage($event)"
  >
    <ng-template #header>
      <tr>
        <th>Requester</th>
        <th>System</th>
        <th>Role</th>
        <th>Justification</th>
        <th>Remarks</th>
        <th>Decision</th>
      </tr>
    </ng-template>
    <ng-template #body let-request>
      <tr>
        <td>{{ request.requesterName }}</td>
        <td>{{ request.targetSystem }}</td>
        <td>{{ request.requestedRole }}</td>
        <td>{{ request.businessJustification }}</td>
        <td>
          <input
            pInputText
            [formControl]="remarkControl(request.id)"
            placeholder="Required remarks"
          />
        </td>
        <td>
          <div class="row-actions">
            <p-button
              label="Approve"
              size="small"
              [disabled]="remarkControl(request.id).invalid"
              (onClick)="decide(request.id, 'approve')"
            />
            <p-button
              label="Reject"
              size="small"
              severity="danger"
              [outlined]="true"
              [disabled]="remarkControl(request.id).invalid"
              (onClick)="decide(request.id, 'reject')"
            />
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="6">No requests are awaiting your approval.</td>
      </tr>
    </ng-template>
  </p-table>
</div>
