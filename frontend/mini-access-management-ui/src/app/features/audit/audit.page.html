<div class="page-head">
  <h1>Audit trail</h1>
</div>

<div class="panel">
  <p-table
    [value]="logs()"
    [lazy]="true"
    [lazyLoadOnInit]="false"
    [paginator]="true"
    [alwaysShowPaginator]="true"
    [first]="(page - 1) * pageSize"
    [rows]="pageSize"
    [totalRecords]="totalCount()"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="Page {currentPage} of {totalPages} · {totalRecords} items"
    [scrollable]="true"
    (onPage)="changePage($event)"
  >
    <ng-template #header>
      <tr>
        <th>Time</th>
        <th>User</th>
        <th>Action</th>
        <th>Entity</th>
        <th>Changes</th>
      </tr>
    </ng-template>
    <ng-template #body let-log>
      <tr>
        <td>{{ log.timestampUtc | date: 'medium' }}</td>
        <td>{{ log.user }}</td>
        <td>{{ log.action }}</td>
        <td>{{ log.entity }} #{{ log.entityId }}</td>
        <td>
          <small>{{ log.oldValue || '-' }} → {{ log.newValue || '-' }}</small>
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="5">No audit events found.</td>
      </tr>
    </ng-template>
  </p-table>
</div>
