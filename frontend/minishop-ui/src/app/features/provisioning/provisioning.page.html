<div class="page-head"><div><h1>Provisioning</h1><p class="muted">Assign roles after final approval.</p></div></div>
@if (error()) { <p class="error-message">{{ error() }}</p> }
<div class="panel table-wrap"><table>
  <thead><tr><th>Requester</th><th>System</th><th>Role</th><th></th></tr></thead>
  <tbody>@for (request of requests(); track request.id) {
    <tr><td>{{ request.requesterName }}</td><td>{{ request.targetSystem }}</td>
      <td>{{ request.requestedRole }}</td><td>
        <button class="primary" type="button" (click)="provision(request.id)">Provision</button>
      </td></tr>
  } @empty { <tr><td colspan="4">No approved requests are waiting.</td></tr> }</tbody>
</table></div>
