<div class="page-head">
  <div>
    <h1>Categories</h1>
    <p class="muted">Organize the product catalog</p>
  </div>
  <p-button label="New category" icon="pi pi-plus" (onClick)="open()" />
</div>

<div class="panel">
  <p-table [value]="items()" [loading]="loading()" [rowHover]="true">
    <ng-template #header>
      <tr>
        <th>Name</th>
        <th>Description</th>
        <th class="actions-column">Actions</th>
      </tr>
    </ng-template>
    <ng-template #body let-category>
      <tr>
        <td><strong>{{ category.name }}</strong></td>
        <td>{{ category.description || '—' }}</td>
        <td>
          <p-button icon="pi pi-pencil" [text]="true" (onClick)="open(category)" />
          <p-button
            icon="pi pi-trash"
            severity="danger"
            [text]="true"
            (onClick)="remove(category)"
          />
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-dialog header="Category" [(visible)]="dialogVisible" [modal]="true" [style]="{ width: '32rem' }">
  <form [formGroup]="form" class="field">
    <label for="categoryName">Name</label>
    <input id="categoryName" pInputText formControlName="name" />

    <label for="categoryDescription">Description</label>
    <textarea id="categoryDescription" pTextarea formControlName="description" rows="4"></textarea>
  </form>

  <ng-template #footer>
    <p-button label="Cancel" severity="secondary" [text]="true" (onClick)="dialogVisible = false" />
    <p-button label="Save" (onClick)="save()" [disabled]="form.invalid" />
  </ng-template>
</p-dialog>
