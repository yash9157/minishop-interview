<div class="page-head">
  <div>
    <h1>Product catalog</h1>
    <p class="muted">Browse active inventory</p>
  </div>
  <input
    pInputText
    [(ngModel)]="search"
    (keyup.enter)="load()"
    placeholder="Search product or SKU"
  />
</div>

<div class="panel">
  <p-table
    [value]="items()"
    [loading]="loading()"
    [paginator]="true"
    [rows]="10"
    [totalRecords]="total()"
    [lazy]="true"
    (onLazyLoad)="page($event)"
    [rowHover]="true"
  >
    <ng-template #header>
      <tr>
        <th>SKU</th>
        <th>Product</th>
        <th>Category</th>
        <th>Price</th>
        <th>Stock</th>
        <th>Status</th>
      </tr>
    </ng-template>
    <ng-template #body let-product>
      <tr>
        <td>{{ product.sku }}</td>
        <td><strong>{{ product.name }}</strong></td>
        <td>{{ product.categoryName }}</td>
        <td>{{ product.price | currency: 'USD' }}</td>
        <td>{{ product.stockQuantity }}</td>
        <td>
          <p-tag
            [value]="product.isActive ? 'Active' : 'Inactive'"
            [severity]="product.isActive ? 'success' : 'secondary'"
          />
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
