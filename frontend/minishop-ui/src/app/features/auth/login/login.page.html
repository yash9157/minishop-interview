<main class="auth-page">
  <section class="auth-card">
    <h1>Sign in</h1>
    <p class="muted">Enter your account details.</p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
      <div class="field">
        <label for="email">Email address</label>
        <input id="email" pInputText formControlName="email" autocomplete="email" />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input
          id="password"
          pInputPassword
          formControlName="password"
          autocomplete="current-password"
        />
      </div>

      @if (error()) {
        <div class="error-message" role="alert">
          <i class="pi pi-exclamation-circle"></i>{{ error() }}
        </div>
      }

      <p-button
        type="submit"
        label="Sign in"
        [loading]="loading()"
        [disabled]="form.invalid"
        styleClass="w-full"
      />
    </form>

    <p class="auth-switch">New to MiniShop? <a routerLink="/register">Create an account</a></p>
  </section>
</main>
