<main class="auth-page">
  <section class="auth-card">
    <h1>Create account</h1>
    <p class="muted">New accounts receive catalog access.</p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
      <div class="field">
        <label for="fullName">Full name</label>
        <input id="fullName" pInputText formControlName="fullName" autocomplete="name" />
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" pInputText formControlName="email" autocomplete="email" />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input
          id="password"
          pInputPassword
          formControlName="password"
          autocomplete="new-password"
        />
        <small>Use at least 8 characters.</small>
      </div>

      @if (error()) {
        <div class="error-message" role="alert">
          <i class="pi pi-exclamation-circle"></i>{{ error() }}
        </div>
      }

      <p-button
        type="submit"
        label="Create account"
        [loading]="loading()"
        [disabled]="form.invalid"
        styleClass="w-full"
      />
    </form>

    <p class="auth-switch">Already have an account? <a routerLink="/login">Sign in</a></p>
  </section>
</main>
