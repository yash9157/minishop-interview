<p-toast />
<p-confirmdialog />

@if (auth.user()) {
  <div class="shell">
    <aside [class.open]="menuOpen">
      <div class="brand">
        <span class="mark">M</span>
        <span>MiniShop<small>Operations</small></span>
      </div>

      <nav>
        <a routerLink="/catalog" routerLinkActive="active">
          <i class="pi pi-shopping-bag"></i>Catalog
        </a>
        @if (auth.isAdmin()) {
          <span class="label">Administration</span>
          <a
            routerLink="/admin"
            [routerLinkActiveOptions]="{ exact: true }"
            routerLinkActive="active"
          >
            <i class="pi pi-chart-bar"></i>Overview
          </a>
          <a routerLink="/admin/categories" routerLinkActive="active">
            <i class="pi pi-tags"></i>Categories
          </a>
          <a routerLink="/admin/products" routerLinkActive="active">
            <i class="pi pi-box"></i>Products
          </a>
          <a routerLink="/admin/customers" routerLinkActive="active">
            <i class="pi pi-users"></i>Customers
          </a>
          <a routerLink="/admin/orders" routerLinkActive="active">
            <i class="pi pi-receipt"></i>Orders
          </a>
        }
      </nav>

      <div class="profile">
        <span class="avatar">{{ auth.user()?.fullName?.charAt(0) }}</span>
        <div>
          <strong>{{ auth.user()?.fullName }}</strong>
          <small>{{ auth.user()?.roles?.[0] }}</small>
        </div>
        <button type="button" aria-label="Sign out" (click)="auth.logout()">
          <i class="pi pi-sign-out"></i>
        </button>
      </div>
    </aside>

    <section class="content">
      <button
        class="menu"
        type="button"
        (click)="menuOpen = !menuOpen"
        aria-label="Toggle navigation"
      >
        <i class="pi pi-bars"></i>
      </button>
      <main><router-outlet /></main>
    </section>
  </div>
} @else {
  <router-outlet />
}
